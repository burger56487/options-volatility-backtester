services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./outputs:/data
    environment:
      - APP_DB_PATH=/data/app.db
      - DATA_ROOT=/data
  dashboard:
    image: python:3.12-slim
    command: sh -c "pip install -q streamlit pandas && streamlit run /app/scripts/dashboard.py --server.port 8501"
    ports:
      - "8501:8501"
    volumes:
      - .:/app
      - ./outputs:/data
  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: ovb
      POSTGRES_PASSWORD: ovb
      POSTGRES_DB: ovb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ovb -d ovb"]
      interval: 5s
      timeout: 5s
      retries: 10
  api-postgres:
    build: .
    profiles: ["postgres"]
    ports:
      - "8000:8000"
    volumes:
      - ./outputs:/data
    environment:
      DATA_ROOT: /data
      DATABASE_URL: postgresql://ovb:ovb@postgres:5432/ovb
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
