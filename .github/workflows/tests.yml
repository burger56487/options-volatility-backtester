name: Python Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tools
        run: python -m pip install ruff==0.16.1 mypy==2.3.1

      - name: Ruff error-level checks
        run: python -m ruff check src tests --output-format concise

      - name: Type check validation module
        run: python -m mypy --ignore-missing-imports --follow-imports=skip src/validation

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests with coverage
        env:
          PYTHONPATH: .
        run: >
          python -m pytest -q -m "not perf"
          --cov=src
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-report=html:htmlcov

      - name: Generate model validation report
        env:
          PYTHONPATH: .
        run: python scripts/run_validation_report.py

      - name: Upload validation report
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: outputs/testing/
          if-no-files-found: error

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            htmlcov
            coverage.xml
          if-no-files-found: error

      - name: Build C++ backend
        run: |
          g++ -shared -O2 -w -std=c++17 -fPIC -pthread cpp/src/bs_kernels.cpp -o outputs/bs_kernels.so

      - name: Run C++ backend tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/pricing/test_cpp_backend.py -m cpp

  perf:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Build C++ backend
        run: |
          g++ -shared -O2 -w -std=c++17 -fPIC -pthread cpp/src/bs_kernels.cpp -o outputs/bs_kernels.so

      - name: Run performance regression tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q -m perf tests/test_performance_regression.py
