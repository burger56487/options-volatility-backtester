name: Python Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q -m "not perf"

      - name: Generate model validation report
        env:
          PYTHONPATH: .
        run: python scripts/run_validation_report.py

      - name: Upload validation report
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: outputs/testing/
          if-no-files-found: error

      - name: Build C++ backend
        run: |
          g++ -shared -O2 -w -std=c++17 -pthread cpp/src/bs_kernels.cpp -o outputs/bs_kernels.so

      - name: Run C++ backend tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/pricing/test_cpp_backend.py -m cpp

      - name: Ruff error-level checks
        run: python -m ruff check src tests --output-format concise
