project:
  name: options-volatility-backtester
  version: "1.1.0"
  research_purpose: education_and_research

data:
  underlying:
    source: public_market_data
    data_type: real
    frequency: daily
    adjusted: true

  options:
    source: synthetic_option_chain_generator
    data_type: synthetic
    historical_quotes: false

  risk_free_rate:
    source: configured
    data_type: assumed

  dividend_yield:
    source: configured
    data_type: assumed

execution:
  mode: simulated
  option_entry_price: ask
  option_exit_price: bid
  hedge_execution: simulated
  commission_enabled: true
  slippage_enabled: true
  market_impact_enabled: false
  partial_fill_enabled: false
  slippage_bps: 1.0
  impact_coefficient: 0.0
  impact_exponent: 0.5
  max_quote_age_seconds: 60.0
  commission_per_share: 0.005
  commission_per_contract: 0.65
  commission_minimum: 1.0

research:
  evaluation_mode: in_sample
  signal_delay_days: 1
  prevent_lookahead: true
  random_seed: 42

output:
  directory: outputs
  save_metadata: true
  save_config_snapshot: true
  save_git_commit: true

data_quality:
  fail_on_invalid: true
  remove_duplicates: true
  max_option_relative_spread: 0.50
  arbitrage_tolerance: 1.0e-8
  save_invalid_records: true
  save_quality_report: true

evaluation:
  scheme: fixed_time_split
  lag_regime_signal: true
  minimum_validation_trades: 3
  minimum_metrics_trades: 5
  test_set_locked: true
  allow_test_parameter_selection: false

  fixed_split:
    train:
      start: "2021-01-01"
      end: "2023-12-31"
    validation:
      start: "2024-01-01"
      end: "2024-12-31"
    test:
      start: "2025-01-01"
      end: "2025-12-31"

account:
  base_currency: USD
  initial_capital: 1000000
  allow_negative_cash: true
  minimum_cash_buffer: 10000

position_sizing:
  method: fixed_premium_budget
  premium_budget_fraction: 0.02
  fixed_contracts: 1
  vega_budget: 5000
  gamma_budget: 100

financing:
  annual_cash_lending_rate: 0.03
  annual_cash_borrowing_rate: 0.06
  annual_stock_borrow_fee_rate: 0.01
  day_count_basis: 365

margin:
  methodology: simplified_research_model
  enforce_initial_margin: true
  enforce_maintenance_margin: true

risk_limits:
  max_gross_exposure: 1500000
  max_leverage: 2.0
  max_abs_delta: 10000
  max_abs_gamma: 1000
  max_abs_vega: 50000
  max_daily_loss: 20000
  max_drawdown: 0.15
  min_cash_buffer: 10000
