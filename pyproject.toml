[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "unit: fast unit tests",
    "integration: cross-module integration tests",
    "model_validation: convergence/degeneration/calibration/VaR validation",
    "property: property-based tests",
    "golden: regression against recorded golden numbers",
    "cpp: tests requiring the compiled C++ backend",
    "perf: performance benchmarks (not run by default)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
